# =============================================================================
# /Flood2026 บน nginx — เพิ่มใน server { } เดียวกับที่รัน /coc
# แล้ว  sudo nginx -t && sudo systemctl reload nginx
# =============================================================================
#
# nginx ไม่อ่าน .htaccess — ต้องกันไฟล์ภายในที่นี่ (บทเรียนเดียวกับ deploy/nginx-coc-protect.conf ของ COC)
# ตอบ 404 ไม่ใช่ 403 เพื่อไม่ยืนยันกับคนนอกว่าไฟล์มีอยู่จริง
# location ~ (regex) ชนะ location แบบ prefix เสมอ จึงวางตรงไหนใน server { } ก็ได้
# -----------------------------------------------------------------------------

# 0) ทางเข้าหลัก — ทุก URL ที่ไม่ใช่ไฟล์จริงส่งเข้า index.php?url=...
location /Flood2026/ {
    client_max_body_size 20m;          # รูปแนบ (ฝั่งเว็บย่อรูปก่อนส่งแล้ว เผื่อไว้)
    try_files $uri $uri/ @flood2026;
}
location @flood2026 {
    rewrite ^/Flood2026/(.*)$ /Flood2026/index.php?url=$1 last;
}

# 1) มีเพียง index.php เท่านั้นที่รันได้ — .php อื่นทุกไฟล์ตอบ 404
#    (views/*.php, controllers, models, libs, config/app.php ห้ามรันตรง)
location ~ ^/Flood2026/(?!index\.php(?:$|\?)).*\.php$ {
    return 404;
}

# 2) ไฟล์/โฟลเดอร์ที่ขึ้นต้นด้วยจุด — .git .gitignore .htaccess
location ~ ^/Flood2026/(.*/)?\.[^/] {
    return 404;
}

# 3) โฟลเดอร์ซอร์ส/ข้อมูล — config = รหัสผ่านฐาน · sql = โครงสร้างฐาน
location ~ ^/Flood2026/(config|controllers|libs|models|sql|scripts|src|deploy|node_modules)/ {
    return 404;
}

# 4) รูปที่ประชาชนอัปโหลด (บ้าน/ผู้ป่วย) — ต้องผ่าน /Flood2026/flood/attachment/<id> ที่ตรวจสิทธิ์ก่อน
location ^~ /Flood2026/public/uploads/ {
    return 404;
}

# 5) เอกสาร/ไฟล์สำรอง/นามสกุลที่ไม่ใช่ asset
#    รวมไฟล์สำรองที่มีวันที่หรือ ~ ต่อท้าย เช่น app.php.bak-20260925, index.php.old, header.php~
location ~ ^/Flood2026/.*\.(md|sql|sample|bak|old|orig|save|swp|tmp|log|ini|conf|env|yml|yaml)([.~_-][^/]*)?$ {
    return 404;
}
location ~ ^/Flood2026/.*~$ {
    return 404;
}

# ตรวจหลังใส่:
#   curl -I http://<server>/Flood2026/config/app.php        → 404
#   curl -I http://<server>/Flood2026/sql/07_flood_seed.sql → 404
#   curl -I http://<server>/Flood2026/INSTALL.md            → 404
#   curl -I http://<server>/Flood2026/config/app.php.bak-20260925 → 404
#   curl -I http://<server>/Flood2026/                      → 200
